<!DOCTYPE html>
<html>
<head>
    <title>Simple Interest Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .container {
            width: 300px;
            margin: auto;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 10px 0;
        }

       button {
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkblue;
        }

        #result {
            color: green;
            margin-top: 15px;
        }

        
    </style>
</head>
<body>

    <div class="container">
        <h2>Simple Interest Calculator</h2>

        <input type="number" id="principal" placeholder="Enter Principal Amount">

        <input type="number" id="rate" placeholder="Enter Rate (%)">

        <input type="number" id="time" placeholder="Enter Time (Years)">

        <button onclick="calculateSI()">Calculate</button>

        <div id="result"></div>
    </div>

    <script>
        function calculateSI() {
            let p = Number(document.getElementById("principal").value);
            let r = Number(document.getElementById("rate").value);
            let t = Number(document.getElementById("time").value);

            let si = (p * r * t) / 100;

            document.getElementById("result").innerHTML =
                "Simple Interest = ₹" + si;
        }
    </script>

</body>
</html>
